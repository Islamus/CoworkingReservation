<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Booking List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 2rem;
        }
        table {
            border-collapse: collapse;
            width: 100%;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 0.75rem;
            text-align: left;
        }
        th {
            background-color: #f4f4f4;
        }
        a {
            text-decoration: none;
            color: #007bff;
        }
        a:hover {
            text-decoration: underline;
        }
        .button {
            padding: 0.5rem 1rem;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            text-decoration: none;
        }
    </style>
</head>
<body>

<h2>All Bookings</h2>

<a href="/book" class="button">+ New Booking</a>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>User</th>
        <th>Workspace</th>
        <th>Start Time</th>
        <th>End Time</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="booking : ${bookings}">
        <td th:text="${booking.id}"></td>
        <td th:text="${booking.user.name}">User Name</td>
        <td th:text="${booking.workspace.type}">Workspace Type</td>
        <td th:text="${@bookingService.formatStartTime(booking.startTime)}"></td>
        <td th:text="${@bookingService.formatEndTime(booking.endTime)}"></td>
    </tr>
    </tbody>
</table>

</body>
</html>
